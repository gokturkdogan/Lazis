[package]
name = "lazis-desktop"
version = "0.1.0"
description = "LAZIS desktop shell (window, Keychain, managed backend lifecycle)"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "lazis_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macOS Keychain + Apple CSPRNG (SecRandomCopyBytes).
security-framework = "3"
sha2 = "0.10"
zeroize = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
