[project]
name = "lazis-core"
version = "0.1.0"
description = "LAZIS local backend — Phase 1 foundation (secure storage, local API, lifecycle)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    # Official binary wheel; bundles SQLCipher 4.x + OpenSSL (hash-pinned in uv.lock).
    # Verified at startup: the app refuses to run if SQLCipher is not active.
    "sqlcipher3>=0.6.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
    "pip-audit>=2.7",
]
# Phase 1 spikes only (SPK-04/05). Not a runtime dependency until P6.
spike = [
    "sqlite-vec>=0.1.6",
]

[project.scripts]
lazis-core = "lazis.app.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lazis"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # assert is fine in tests; production code does not rely on assert
    "RUF001", "RUF002", "RUF003",  # Turkish text (ı, İ, ş, ğ …) is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501", "RUF043"]
"spikes/**" = ["S"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "keychain: touches the real macOS login Keychain (uses a dedicated test service name)",
    "slow: long-running (process spawning, performance)",
]

[tool.importlinter]
root_package = "lazis"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "lazis.app",
    "lazis.api",
    "lazis.storage",
    "lazis.security | lazis.observability",
    "lazis.config",
    "lazis.errors | lazis.i18n | lazis.ids | lazis.fsutil",
]

[[tool.importlinter.contracts]]
name = "Only storage imports the SQLCipher driver"
type = "forbidden"
source_modules = ["lazis.api", "lazis.config", "lazis.security", "lazis.observability", "lazis.app"]
forbidden_modules = ["sqlcipher3", "sqlite3"]
allow_indirect_imports = true
